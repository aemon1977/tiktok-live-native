<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1b2b"/>
      <stop offset="1" stop-color="#05050a"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3b6b"/>
      <stop offset="1" stop-color="#fe2c55"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="55.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  <!-- broadcast waves: cyan shadow + pink, offset like a chromatic split -->
  <g fill="none" stroke-width="13" stroke-linecap="round" transform="translate(-4 -3)">
    <path d="M86 70a62 62 0 0 0 0 88" stroke="#25f4ee"/>
    <path d="M170 70a62 62 0 0 1 0 88" stroke="#25f4ee"/>
    <path d="M106 90a34 34 0 0 0 0 48" stroke="#25f4ee"/>
    <path d="M150 90a34 34 0 0 1 0 48" stroke="#25f4ee"/>
  </g>
  <g fill="none" stroke-width="13" stroke-linecap="round" transform="translate(4 3)">
    <path d="M86 70a62 62 0 0 0 0 88" stroke="#fe2c55"/>
    <path d="M170 70a62 62 0 0 1 0 88" stroke="#fe2c55"/>
    <path d="M106 90a34 34 0 0 0 0 48" stroke="#fe2c55"/>
    <path d="M150 90a34 34 0 0 1 0 48" stroke="#fe2c55"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round">
    <path d="M86 70a62 62 0 0 0 0 88"/>
    <path d="M170 70a62 62 0 0 1 0 88"/>
    <path d="M106 90a34 34 0 0 0 0 48"/>
    <path d="M150 90a34 34 0 0 1 0 48"/>
  </g>
  <circle cx="128" cy="114" r="15" fill="#ffffff"/>
  <!-- LIVE pill -->
  <rect x="64" y="180" width="128" height="44" rx="22" fill="url(#pill)"/>
  <circle cx="90" cy="202" r="7" fill="#ffffff"/>
  <text x="140" y="215" font-family="DejaVu Sans, Cantarell, sans-serif" font-size="30" font-weight="700"
        fill="#ffffff" text-anchor="middle" letter-spacing="1">LIVE</text>
</svg>
